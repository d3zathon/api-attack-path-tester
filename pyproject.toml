[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apiattack"
version = "0.1.0"
description = "API Attack-Path & Authorization Tester - authorized security testing for BOLA/IDOR, BFLA, privilege escalation, parameter tampering, and business-logic flaws."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = [
    "typer>=0.12,<0.13",
    "click>=8.1,<8.2",
    "rich>=13.7",
    "requests>=2.31",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "flask>=3.0",
    "responses>=0.25",
]

[project.scripts]
apiattack = "apiattack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
